name: Bug report
description: Something gives a wrong result or raises unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproducible example
      description: Include the data (or a simulation of it) so it can be run as-is.
      render: python
    validations: {required: true}
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `python -c "import pyFragility, numpy, scipy, statsmodels, sys; print(pyFragility.__version__, numpy.__version__, scipy.__version__, statsmodels.__version__, sys.version)"`
    validations: {required: true}
