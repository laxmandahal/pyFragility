[project]
name = "pyFragility"
dynamic = ["version"]
description = "Fragility function fitting for any data type, with misspecification-robust uncertainty."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Laxman Dahal", email = "laxman.dahal@ucla.edu" }]
keywords = ["fragility", "collapse risk", "mle", "qmle", "sandwich estimator", "misspecification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "numdifftools>=0.9.41",
    "sympy>=1.12",
]
examples = ["ipykernel>=6.29", "nbformat>=5.10", "nbclient>=0.10"]

[project.urls]
Homepage = "https://github.com/laxmandahal/pyFragility"
Documentation = "https://pyfragility.readthedocs.io"
Changelog = "https://github.com/laxmandahal/pyFragility/blob/main/CHANGELOG.md"
Issues = "https://github.com/laxmandahal/pyFragility/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pyFragility/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pyFragility"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-ra --strict-markers --strict-config --doctest-modules"
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS"
markers = [
    "slow: simulation-heavy tests (deselect with -m 'not slow')",
    "notebooks: executes the example notebooks (needs the 'examples' extra)",
]
filterwarnings = [
    "error",
    # third-party deprecations we cannot act on (raised inside dependencies)
    "ignore::DeprecationWarning:mpmath.*",
    "ignore::DeprecationWarning:pyparsing.*",
    "ignore::pyparsing.warnings.PyparsingDeprecationWarning",
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]

[tool.coverage.run]
source = ["src/pyFragility"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
